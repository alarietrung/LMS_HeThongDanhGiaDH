services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mituni
      POSTGRES_USER: mituni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mituni -d mituni"]
      interval: 10s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10
    restart: unless-stopped
  app:
    profiles: ["production"]
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://mituni:${POSTGRES_PASSWORD}@postgres:5432/mituni
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
